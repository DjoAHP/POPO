    <!-- Applique le thème mémorisé AVANT le premier rendu, pour éviter tout flash.
         Le thème sombre est la valeur par défaut (section 6 de la spec). -->
    <script>
      try {
        var theme = localStorage.getItem("popo:theme");
        document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
      } catch (e) {
        /* localStorage indisponible : on reste en sombre */
      }
    </script>
